name: CI

# Lint every PHP file and run the tests that can run without a live store.
#
# tests/QuoteOnlyModeTest.php loads the real module class against small
# PrestaShop stubs (tests/stubs.php); no PrestaShop install needed.
#
# One zip serves PrestaShop 1.7, 8 and 9, so the PHP range is wide:
#   - 7.2: the module's own floor (composer.json "php": ">=7.2.5") and what
#     PrestaShop 1.7 shops run. Lint only, to catch PHP 8-only syntax.
#   - 8.1: PrestaShop 9.0's minimum.
#   - 8.3: what the README's local test command uses.
#   - 8.5: PrestaShop 9.1's recommended PHP. The TackApiClient deprecation test
#     (curl_close() is deprecated in 8.5) can only go red here.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-php72:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 7.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.2'

      - name: Lint PHP
        run: |
          find . -path ./dist -prune -o -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, simplexml

      - name: Lint PHP
        run: |
          find . -path ./dist -prune -o -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: php tests/QuoteOnlyModeTest.php

  package:
    runs-on: ubuntu-latest
    needs: [lint-php72, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build release artifact(s)
        run: bash scripts/package.sh dist
